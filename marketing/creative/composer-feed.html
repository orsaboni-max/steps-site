<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; background:#0d0d0d; }
  .box { position:relative; width:1080px; height:1080px; font-family:'Heebo',sans-serif; }
  .photo { position:absolute; inset:0; width:1080px; height:1080px; object-fit:cover; object-position:center 58%; display:block; }
  /* dark gradient at top so the text is always readable */
  .grad { position:absolute; top:0; left:0; width:1080px; height:440px;
    background:linear-gradient(to bottom, rgba(13,13,13,.92) 0%, rgba(13,13,13,.55) 45%, rgba(13,13,13,0) 100%); }
  .kicker { position:absolute; top:72px; left:0; width:1080px; text-align:center;
    font-size:30px; font-weight:700; letter-spacing:9px; color:#F5C518; }
  .title { position:absolute; top:114px; left:0; width:1080px; text-align:center;
    font-size:132px; font-weight:900; letter-spacing:3px; line-height:1;
    color:#fff; text-shadow:0 3px 18px rgba(0,0,0,.6); }
  .title b { color:#F5C518; }
  .sub { position:absolute; top:272px; left:0; width:1080px; text-align:center;
    font-size:48px; font-weight:800; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.7); }
  .sub span { color:#F5C518; }
</style>
</head>
<body>
  <div class="box">
    <img class="photo" src="kids-12-15-hero-1.png" alt="">
    <div class="grad"></div>
    <div class="kicker">FITNESS · נתניה</div>
    <div class="title">STEPS <b>KIDS</b></div>
    <div class="sub">אימון נוער · גיל <span>12–15</span></div>
  </div>
</body>
</html>
